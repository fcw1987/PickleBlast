name: Watch validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: Source and unsigned Watch validation
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate source, unsigned Watch builds, and available UI tests
        run: bash scripts/ci_watch.sh

      - name: Retain unsigned Watch UI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-ui-results
          path: .build/CI/watch-ui-*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
