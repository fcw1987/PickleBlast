name: Feature request
description: Suggest a feature for PickleBlast.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        GitHub Issues are public and posting requires a GitHub account. Please leave
        out personal details and private information. Suggestions are welcome; code,
        artwork, and pull request contributions are not accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem or use case would this address?
      description: Describe when you would want this during a quick Apple Watch play session.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What behavior do you propose?
      description: Describe what you would expect the game to do.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why does this fit Apple Watch quick play?
      description: Explain how it would work for short, glanceable play on the Watch.
    validations:
      required: true
